name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  dashboard:
    name: Dashboard build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentiment-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sentiment-dashboard/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: Backend Lambda tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: pytest backend
